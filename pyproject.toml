[project]
name = "downkyi-web"
version = "0.1.0"
description = "A headless Bilibili downloader with a web interface"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "yt-dlp>=2026.3.17",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["static/*.png"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
